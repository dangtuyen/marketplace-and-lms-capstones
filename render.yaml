services:
  # ==========================================
  # 1. FS-01: NEXMALL BACKEND (API)
  # ==========================================
  - type: web
    name: fs01-nexmall-backend
    runtime: node
    plan: free
    rootDir: FS-01/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # ==========================================
  # 2. FS-01: NEXMALL FRONTEND (STATIC SITE)
  # ==========================================
  - type: web
    name: fs01-nexmall-frontend
    runtime: static
    rootDir: FS-01/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: fs01-nexmall-backend
          property: host

  # ==========================================
  # 3. FS-03: EDUSTREAM LMS BACKEND (API)
  # ==========================================
  - type: web
    name: fs03-edustream-backend
    runtime: node
    plan: free
    rootDir: FS-03/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_SERVER_URL
        sync: false

  # ==========================================
  # 4. FS-03: EDUSTREAM LMS FRONTEND (STATIC SITE)
  # ==========================================
  - type: web
    name: fs03-edustream-frontend
    runtime: static
    rootDir: FS-03/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: fs03-edustream-backend
          property: host