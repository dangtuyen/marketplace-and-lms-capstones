services:
  # ==========================================
  # 1. FS-01: NEXMALL BACKEND (API)
  # ==========================================
  - type: web
    name: fs01-nexmall-backend
    runtime: node
    plan: free
    rootDir: FS-01/vendorHubBE
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: PLATFORM_COMMISSION_FEE
        value: 10
      - key: S3_ENDPOINT
        value: https://supabase.co
      - key: S3_BUCKET_NAME
        value: vendorhub_bucket
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        value: eu-west-1

  # ==========================================
  # 2. FS-01: NEXMALL FRONTEND (CREATE REACT APP)
  # ==========================================
  - type: web
    name: fs01-nexmall-frontend
    runtime: static
    rootDir: FS-01/vendorHubFE
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: fs01-nexmall-backend
          property: host
      - key: REACT_APP_STRIPE_PUBLISHABLE_KEY
        sync: false

  # ==========================================
  # 3. FS-03: EDUSTREAM LMS BACKEND (API)
  # ==========================================
  - type: web
    name: fs03-edustream-backend
    runtime: node
    plan: free
    rootDir: FS-03/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_SERVER_URL
        sync: false

  # ==========================================
  # 4. FS-03: EDUSTREAM LMS FRONTEND (VITE)
  # ==========================================
  - type: web
    name: fs03-edustream-frontend
    runtime: static
    rootDir: FS-03/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: fs03-edustream-backend
          property: host